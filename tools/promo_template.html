<!doctype html>
<!-- Customer-facing promotion page. Generated by tools/gen_promo_gemini.py,
     which replaces the single PROMO token below with the promotion JSON.
     Unlisted by design:
     meta noindex + robots.txt Disallow /p/ + never linked from the site.
     Shows NO prices anywhere — the customer ticks items and sends an inquiry;
     the salesperson quotes privately. All dynamic strings come from the promo
     JSON (already language-resolved at generation time); the fixed UI strings
     below carry their own tiny per-language dict — this page deliberately does
     NOT load the site's i18n.js or appear in any app list. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<!-- unfurl bots (Teams/Slack link previews) must see only generic text,
     never customer-specific content -->
<meta property="og:title" content="Birdland — Product information">
<meta property="og:description" content="Birdland Enterprise Co., Ltd. — OEM/ODM garden and field hand tools, Taiwan.">
<title>Birdland — Product Promotion</title>
<style>
:root{--ink:#1e2320;--paper:#faf8f4;--line:#d8d2c6;--accent:#2f5d3a;--soft:#6b7268}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.55 Georgia,'Times New Roman',serif;padding:0 16px 64px}
.wrap{max-width:880px;margin:0 auto}
header{padding:28px 0 18px;border-bottom:3px double var(--ink)}
.brand{font:700 15px/1 Arial,Helvetica,sans-serif;letter-spacing:.18em;text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:10px 0 6px;text-wrap:balance}
.meta{font:13px/1.5 Arial,Helvetica,sans-serif;color:var(--soft)}
.notice{margin:18px 0;padding:12px 14px;border:1px solid var(--line);background:#fff;font:14px/1.55 Arial,Helvetica,sans-serif}
.intro{margin:18px 0;font-size:17px}
.why{margin:16px 0;padding:14px 16px;border-inline-start:4px solid var(--accent);background:#f1efe8}
.why h2{font:700 13px/1 Arial,Helvetica,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.why li{margin:4px 0 4px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin:26px 0}
.card{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-bottom:1px solid var(--line)}
.cb{padding:14px 14px 12px;flex:1;display:flex;flex-direction:column;gap:6px}
.code{font:700 12px/1 Arial,Helvetica,sans-serif;letter-spacing:.08em;color:var(--soft)}
.card h3{font-size:18px;line-height:1.25}
.card ul{font:13px/1.5 Arial,Helvetica,sans-serif;color:#3a403c;padding-left:16px}
.moq{font:12px/1 Arial,Helvetica,sans-serif;color:var(--soft)}
.appeal{font-size:14px;font-style:italic;color:#2c4433}
.pick{margin-top:auto;padding:10px 14px;border-top:1px solid var(--line);background:#f7f5ef;
 font:600 14px/1 Arial,Helvetica,sans-serif;display:flex;gap:8px;align-items:center;cursor:pointer;user-select:none}
.pick input{width:18px;height:18px;accent-color:var(--accent)}
.contact{margin-top:30px;padding:20px;border:1px solid var(--line);background:#fff}
.contact h2{font:700 13px/1 Arial,Helvetica,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.sname{font-size:18px;font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{font:600 14px/1 Arial,Helvetica,sans-serif;padding:12px 16px;border:1px solid var(--ink);
 background:var(--ink);color:#fff;text-decoration:none;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.btn.alt{background:#fff;color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.count{font:13px/1 Arial,Helvetica,sans-serif;color:var(--soft);margin-top:8px}
.langbar{display:flex;gap:6px;margin-top:12px}
.langbar button{font:600 12px/1 Arial,Helvetica,sans-serif;padding:6px 10px;border:1px solid var(--line);background:#fff;cursor:pointer}
.langbar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#expired{display:none;margin:40px 0;padding:24px;border:2px solid var(--ink);background:#fff;font-size:18px;text-align:center}
footer{margin-top:36px;font:12px/1.6 Arial,Helvetica,sans-serif;color:var(--soft);border-top:1px solid var(--line);padding-top:12px}
#fab{position:fixed;inset-block-end:20px;inset-inline-end:20px;z-index:9}
#fabBtn{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;
 font-size:24px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#fabMenu{display:none;position:absolute;inset-block-end:66px;inset-inline-end:0;min-width:230px;
 background:#fff;border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.18)}
#fabMenu.open{display:block}
#fabMenu a{display:block;padding:13px 16px;font:600 14px/1.2 Arial,Helvetica,sans-serif;
 color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
#fabMenu a:last-child{border-bottom:0}
#fabMenu a:hover{background:#f1efe8}
#fabName{padding:10px 16px;font:12px/1.4 Arial,Helvetica,sans-serif;color:var(--soft);
 border-bottom:1px solid var(--line);background:#f7f5ef}
@media(max-width:600px){#fabBtn{width:48px;height:48px;font-size:20px}}
@media print{.pick,.btns,.langbar,.notice,#fab{display:none}.card{break-inside:avoid}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div class="brand">Birdland &middot; Taiwan</div>
 <h1 id="title"></h1>
 <div class="meta"><span id="validLbl"></span> <span id="validDate"></span></div>
 <div class="langbar" id="langbar"></div>
</header>
<div id="expired"></div>
<div id="live">
 <p class="notice" id="notice"></p>
 <p class="intro" id="intro"></p>
 <div class="why" id="why" hidden><h2 id="whyLbl"></h2><ul id="whyList"></ul></div>
 <div class="grid" id="grid"></div>
 <div class="contact">
  <h2 id="contactLbl"></h2>
  <div class="sname" id="salesName"></div>
  <div class="meta" id="salesMail"></div>
  <div class="count" id="pickCount"></div>
  <div class="btns">
   <button class="btn" id="sendBtn"></button>
   <button class="btn alt" id="csvBtn"></button>
   <a class="btn alt" id="teamsBtn" target="_blank" rel="noopener"></a>
   <button class="btn alt" id="printBtn"></button>
  </div>
 </div>
</div>
<footer>Birdland Enterprise Co., Ltd. &mdash; OEM/ODM garden &amp; field hand tools, Taiwan.</footer>
</div>
<div id="fab" hidden>
 <div id="fabMenu">
  <div id="fabName"></div>
  <a id="fabTeams" target="_blank" rel="noopener"></a>
  <a id="fabMail"></a>
 </div>
 <button id="fabBtn" aria-haspopup="true" aria-expanded="false" aria-label="Contact">&#128172;</button>
</div>
<script type="application/json" id="promo-data">__PROMO__</script>
<script>
(function(){
'use strict';
var P={};try{P=JSON.parse(document.getElementById('promo-data').textContent||'{}');}catch(e){}
if(!P.slug){document.getElementById('live').hidden=true;return;}

/* Fixed UI strings, one tiny dict per supported language. Keys are stable ids,
   NOT display text — this page never loads the site's i18n machinery. */
var UI={
 en:{valid:'Valid until',why:'Why now',moq:'MOQ',pick:'Interested',contact:'Your contact at Birdland',
  send:'Send inquiry',csv:'Download selection (Excel CSV)',teams:'Chat on Microsoft Teams',print:'Print / save PDF',
  notice:'Tick the items you are interested in and send us an inquiry. This page shows no prices — your Birdland contact will get back to you directly.',
  expired:'This promotion has ended. Please contact your Birdland representative for the current offer.',
  picked:'items selected',inq:'Inquiry about',item:'Item code',product:'Product',qty:'Quantity (pcs)',interested:'Interested',
  mailIntro:'Hello, I would like to receive an offer for the following items:',company:'Company / name:'},
 'zh-tw':{valid:'有效期至',why:'為何此時',moq:'最低訂購量',pick:'有興趣',contact:'您的 Birdland 聯絡窗口',
  send:'送出詢價',csv:'下載勾選清單(Excel CSV)',teams:'Microsoft Teams 即時聯繫',print:'列印 / 儲存 PDF',
  notice:'請勾選您有興趣的品項並送出詢價。本頁不顯示金額——您的 Birdland 窗口會直接與您聯繫。',
  expired:'本檔推廣已結束,請聯繫您的 Birdland 業務窗口取得最新資訊。',
  picked:'項已勾選',inq:'詢價:',item:'品號',product:'品名',qty:'數量(支)',interested:'有興趣',
  mailIntro:'您好,我想詢問以下品項:',company:'公司/姓名:'},
 de:{valid:'Gültig bis',why:'Warum jetzt',moq:'Mindestbestellmenge',pick:'Interessiert',contact:'Ihr Ansprechpartner bei Birdland',
  send:'Anfrage senden',csv:'Auswahl herunterladen (Excel CSV)',teams:'Chat über Microsoft Teams',print:'Drucken / als PDF speichern',
  notice:'Markieren Sie die Artikel, die Sie interessieren, und senden Sie uns eine Anfrage. Diese Seite zeigt keine Beträge — Ihr Birdland-Kontakt meldet sich direkt bei Ihnen.',
  expired:'Diese Aktion ist beendet. Bitte kontaktieren Sie Ihren Birdland-Ansprechpartner für das aktuelle Angebot.',
  picked:'Artikel ausgewählt',inq:'Anfrage zu',item:'Artikelnummer',product:'Produkt',qty:'Menge (Stück)',interested:'Interessiert',
  mailIntro:'Guten Tag, ich interessiere mich für folgende Artikel:',company:'Firma / Name:'},
 fr:{valid:'Valable jusqu’au',why:'Pourquoi maintenant',moq:'Quantité minimale',pick:'Intéressé',contact:'Votre contact chez Birdland',
  send:'Envoyer la demande',csv:'Télécharger la sélection (Excel CSV)',teams:'Discuter sur Microsoft Teams',print:'Imprimer / enregistrer en PDF',
  notice:'Cochez les articles qui vous intéressent et envoyez-nous votre demande. Cette page n’affiche aucun montant — votre contact Birdland vous répondra directement.',
  expired:'Cette promotion est terminée. Veuillez contacter votre représentant Birdland pour l’offre actuelle.',
  picked:'articles sélectionnés',inq:'Demande concernant',item:'Référence',product:'Produit',qty:'Quantité (pcs)',interested:'Intéressé',
  mailIntro:'Bonjour, je souhaite recevoir une offre pour les articles suivants :',company:'Société / nom :'},
 es:{valid:'Válido hasta',why:'Por qué ahora',moq:'Cantidad mínima',pick:'Me interesa',contact:'Su contacto en Birdland',
  send:'Enviar consulta',csv:'Descargar selección (Excel CSV)',teams:'Chatear por Microsoft Teams',print:'Imprimir / guardar PDF',
  notice:'Marque los artículos que le interesan y envíenos su consulta. Esta página no muestra importes — su contacto de Birdland le responderá directamente.',
  expired:'Esta promoción ha finalizado. Contacte con su representante de Birdland para la oferta actual.',
  picked:'artículos seleccionados',inq:'Consulta sobre',item:'Referencia',product:'Producto',qty:'Cantidad (pzas)',interested:'Me interesa',
  mailIntro:'Hola, me gustaría recibir información sobre los siguientes artículos:',company:'Empresa / nombre:'},
 it:{valid:'Valido fino al',why:'Perché ora',moq:'Quantità minima',pick:'Interessato',contact:'Il suo contatto Birdland',
  send:'Invia richiesta',csv:'Scarica selezione (Excel CSV)',teams:'Chat su Microsoft Teams',print:'Stampa / salva PDF',
  notice:'Selezioni gli articoli di suo interesse e ci invii una richiesta. Questa pagina non mostra importi — il suo contatto Birdland la ricontatterà direttamente.',
  expired:'Questa promozione è terminata. Contatti il suo referente Birdland per l’offerta attuale.',
  picked:'articoli selezionati',inq:'Richiesta su',item:'Codice articolo',product:'Prodotto',qty:'Quantità (pz)',interested:'Interessato',
  mailIntro:'Buongiorno, vorrei ricevere un’offerta per i seguenti articoli:',company:'Azienda / nome:'},
 nl:{valid:'Geldig tot',why:'Waarom nu',moq:'Minimale afname',pick:'Interesse',contact:'Uw contactpersoon bij Birdland',
  send:'Aanvraag versturen',csv:'Selectie downloaden (Excel CSV)',teams:'Chatten via Microsoft Teams',print:'Afdrukken / opslaan als PDF',
  notice:'Vink de artikelen aan waarin u interesse heeft en stuur ons een aanvraag. Deze pagina toont geen bedragen — uw Birdland-contact reageert rechtstreeks.',
  expired:'Deze promotie is afgelopen. Neem contact op met uw Birdland-vertegenwoordiger voor het actuele aanbod.',
  picked:'artikelen geselecteerd',inq:'Aanvraag over',item:'Artikelnummer',product:'Product',qty:'Aantal (stuks)',interested:'Interesse',
  mailIntro:'Goedendag, ik ontvang graag een aanbieding voor de volgende artikelen:',company:'Bedrijf / naam:'},
 pl:{valid:'Ważne do',why:'Dlaczego teraz',moq:'Minimalne zamówienie',pick:'Zainteresowany',contact:'Twój kontakt w Birdland',
  send:'Wyślij zapytanie',csv:'Pobierz wybór (Excel CSV)',teams:'Czat przez Microsoft Teams',print:'Drukuj / zapisz PDF',
  notice:'Zaznacz interesujące Cię pozycje i wyślij zapytanie. Ta strona nie pokazuje kwot — Twój kontakt w Birdland odpowie bezpośrednio.',
  expired:'Ta promocja dobiegła końca. Skontaktuj się ze swoim przedstawicielem Birdland po aktualną ofertę.',
  picked:'pozycji zaznaczonych',inq:'Zapytanie o',item:'Numer artykułu',product:'Produkt',qty:'Ilość (szt.)',interested:'Zainteresowany',
  mailIntro:'Dzień dobry, proszę o informację o następujących pozycjach:',company:'Firma / imię i nazwisko:'},
 'pt-br':{valid:'Válido até',why:'Por que agora',moq:'Pedido mínimo',pick:'Tenho interesse',contact:'Seu contato na Birdland',
  send:'Enviar consulta',csv:'Baixar seleção (Excel CSV)',teams:'Conversar no Microsoft Teams',print:'Imprimir / salvar PDF',
  notice:'Marque os itens de seu interesse e envie sua consulta. Esta página não exibe valores — seu contato Birdland responderá diretamente.',
  expired:'Esta promoção foi encerrada. Fale com seu representante Birdland para a oferta atual.',
  picked:'itens selecionados',inq:'Consulta sobre',item:'Código do item',product:'Produto',qty:'Quantidade (pçs)',interested:'Tenho interesse',
  mailIntro:'Olá, gostaria de receber uma oferta para os seguintes itens:',company:'Empresa / nome:'},
 ja:{valid:'有効期限',why:'今このご提案の理由',moq:'最低発注数量',pick:'関心あり',contact:'Birdland 担当窓口',
  send:'お問い合わせを送信',csv:'選択リストをダウンロード(Excel CSV)',teams:'Microsoft Teams でチャット',print:'印刷 / PDF 保存',
  notice:'ご関心のある品目にチェックを入れてお問い合わせください。本ページに金額は表示されません。担当者より直接ご連絡いたします。',
  expired:'本プロモーションは終了しました。最新のご案内は Birdland 担当者までお問い合わせください。',
  picked:'件選択中',inq:'お問い合わせ:',item:'品番',product:'製品名',qty:'数量(本)',interested:'関心あり',
  mailIntro:'お世話になっております。下記品目についてご案内をお願いいたします。',company:'会社名 / お名前:'}
};

var lang=(P.tr&&UI[P.lang])?P.lang:'en';
var picks={};
function S(k){return (UI[lang]||UI.en)[k]||UI.en[k]||k;}
function C(){ /* language-resolved content */
 return (lang!=='en'&&P.tr)?P.tr:P;
}
function esc(s){var d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML;}

function render(){
 var c=C();
 document.title=(c.title||P.title)+' — Birdland';
 document.documentElement.lang=lang;
 document.getElementById('title').textContent=c.title||P.title;
 document.getElementById('validLbl').textContent=S('valid');
 document.getElementById('validDate').textContent=P.expires;
 document.getElementById('notice').textContent=S('notice');
 document.getElementById('intro').textContent=c.intro||P.intro;
 var why=(c.why_now&&c.why_now.length?c.why_now:P.why_now)||[];
 var wl=document.getElementById('whyList');wl.innerHTML='';
 document.getElementById('why').hidden=!why.length;
 document.getElementById('whyLbl').textContent=S('why');
 why.forEach(function(w){var li=document.createElement('li');li.textContent=w;wl.appendChild(li);});
 var g=document.getElementById('grid');g.innerHTML='';
 P.items.forEach(function(it,i){
  var t=(lang!=='en'&&P.tr&&P.tr.items[i])?P.tr.items[i]:it;
  var img=(P.images||[])[i]?'<img loading="lazy" alt="" src="'+esc(P.images[i])+'">':'';
  var card=document.createElement('div');card.className='card';
  card.innerHTML=img+'<div class="cb"><div class="code">'+esc(it.code)+'</div>'
   +'<h3>'+esc(t.name||it.name)+'</h3>'
   +'<ul>'+(t.specs&&t.specs.length?t.specs:it.specs).map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul>'
   +(it.moq?'<div class="moq">'+esc(S('moq'))+': '+esc(it.moq)+'</div>':'')
   +((t.appeal||it.appeal)?'<div class="appeal">'+esc(t.appeal||it.appeal)+'</div>':'')
   +'</div><label class="pick"><input type="checkbox" data-code="'+esc(it.code)+'"'
   +(picks[it.code]?' checked':'')+'> '+esc(S('pick'))+'</label>';
  g.appendChild(card);
 });
 g.querySelectorAll('input[type=checkbox]').forEach(function(cb){
  cb.addEventListener('change',function(){picks[cb.dataset.code]=cb.checked;update();});
 });
 document.getElementById('contactLbl').textContent=S('contact');
 document.getElementById('salesName').textContent=P.sales.name||'Birdland sales team';
 document.getElementById('salesMail').textContent=P.sales.email||'';
 document.getElementById('sendBtn').textContent=S('send');
 document.getElementById('csvBtn').textContent=S('csv');
 document.getElementById('printBtn').textContent=S('print');
 var tb=document.getElementById('teamsBtn');
 tb.textContent=S('teams');
 if(P.sales.email){tb.href='https://teams.microsoft.com/l/chat/0/0?users='+encodeURIComponent(P.sales.email);}
 else{tb.style.display='none';}
 fabRender();
 update();
}
function chosen(){return P.items.filter(function(it){return picks[it.code];});}
function update(){
 var n=chosen().length;
 document.getElementById('pickCount').textContent=n+' '+S('picked');
 document.getElementById('sendBtn').disabled=!n;
 document.getElementById('csvBtn').disabled=!n;
}
document.getElementById('sendBtn').addEventListener('click',function(){
 var c=chosen();if(!c.length)return;
 var body=S('mailIntro')+'\n\n'+c.map(function(it){return '- '+it.code+'  '+it.name;}).join('\n')
  +'\n\n'+S('qty')+':\n'+S('company')+'\n\n['+P.slug+']';
 location.href='mailto:'+encodeURIComponent(P.sales.email||'')
  +'?subject='+encodeURIComponent(S('inq')+' '+P.title+' ['+P.slug+']')
  +'&body='+encodeURIComponent(body);
});
document.getElementById('csvBtn').addEventListener('click',function(){
 var c=chosen();if(!c.length)return;
 var rows=[[S('item'),S('product'),S('interested'),S('qty')]];
 c.forEach(function(it){rows.push([it.code,it.name,'yes','']);});
 var csv='﻿'+rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');
 var a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
 a.download='birdland-inquiry-'+P.slug+'.csv';a.click();
 setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
});
document.getElementById('printBtn').addEventListener('click',function(){window.print();});

/* floating contact button: Teams chat + email for THIS promotion's salesperson */
function fabRender(){
 if(!P.sales||!P.sales.email)return;
 var fab=document.getElementById('fab');fab.hidden=false;
 document.getElementById('fabName').textContent=(P.sales.name||'Birdland')+' · '+P.sales.email;
 var ft=document.getElementById('fabTeams');
 ft.textContent=S('teams');
 ft.href='https://teams.microsoft.com/l/chat/0/0?users='+encodeURIComponent(P.sales.email);
 var fm=document.getElementById('fabMail');
 fm.textContent='Email';
 fm.href='mailto:'+encodeURIComponent(P.sales.email);
}
document.getElementById('fabBtn').addEventListener('click',function(){
 var m=document.getElementById('fabMenu');
 var open=!m.classList.contains('open');
 m.classList.toggle('open',open);
 this.setAttribute('aria-expanded',open?'true':'false');
});
document.addEventListener('click',function(e){
 if(!document.getElementById('fab').contains(e.target)){
  document.getElementById('fabMenu').classList.remove('open');
  document.getElementById('fabBtn').setAttribute('aria-expanded','false');
 }
});
fabRender();

/* language toggle: English + the promotion's target language (if translated) */
var bar=document.getElementById('langbar');
var langs=['en'];if(P.tr&&UI[P.lang])langs.push(P.lang);
if(langs.length>1){langs.forEach(function(l){
 var b=document.createElement('button');b.textContent=l.toUpperCase();
 b.className=l===lang?'on':'';
 b.addEventListener('click',function(){lang=l;
  bar.querySelectorAll('button').forEach(function(x){x.className=x.textContent.toLowerCase()===l?'on':'';});
  render();});
 bar.appendChild(b);});}

/* expiry: honest, client-side (static site) */
var today=new Date().toISOString().slice(0,10);
if(P.expires&&today>P.expires){
 document.getElementById('expired').style.display='block';
 document.getElementById('expired').textContent=S('expired');
 document.getElementById('live').hidden=true;
 document.getElementById('title').textContent=C().title||P.title;
 document.getElementById('validLbl').textContent=S('valid');
 document.getElementById('validDate').textContent=P.expires;
}else{
 render();
}
})();
</script>
</body>
</html>

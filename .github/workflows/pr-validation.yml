name: PR Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check patch whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          base_ref="${BASE_SHA:-origin/main}"
          git diff --check "$base_ref...HEAD"

      - name: Rebuild in memory and validate schema
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const os = require('os');

          const failures = [];
          const read = (file) => fs.readFileSync(file, 'utf8');
          const dataText = read('outlook-data.json');
          const data = JSON.parse(dataText);

          const requiredTopLevel = [
            'regions', 'order', 'news', 'indices', 'macro', 'landed',
            'timeline', 'tariff_calc', 'market_news', 'forward', 'shipping',
            'war', 'procurement', 'material', 'teamAnalysis', 'partner',
            'teamdesk', 'updated', 'birdbot_client'
          ];
          for (const key of requiredTopLevel) {
            if (!(key in data)) failures.push(`missing top-level key: ${key}`);
          }

          const regionKeys = Object.keys(data.regions || {});
          if (regionKeys.length !== 14) {
            failures.push(`expected 14 regions, got ${regionKeys.length}`);
          }
          if (!Array.isArray(data.order) || data.order.length !== 14) {
            failures.push(`expected order to contain 14 entries`);
          } else {
            const orderCodes = data.order.map((entry) => Array.isArray(entry) ? entry[0] : null);
            if (orderCodes.some((code) => typeof code !== 'string')) {
              failures.push('every order entry must be [code, label]');
            }
            if ([...orderCodes].sort().join(',') !== [...regionKeys].sort().join(',')) {
              failures.push('order/regions key mismatch');
            }
          }
          if (typeof data.updated !== 'string' || !data.updated.trim()) {
            failures.push('updated must be a non-empty string');
          }

          for (const [code, region] of Object.entries(data.regions || {})) {
            for (const key of ['headline', 'regulation', 'supply', 'view', 'summary', 'viz']) {
              if (!(key in region)) failures.push(`region ${code} missing ${key}`);
            }
          }

          if ('status' in data) {
            const workflow = (((data.status || {}).workflow) || {});
            if (typeof workflow.state !== 'string' || !workflow.state.trim()) {
              failures.push('status.workflow.state must be a non-empty string');
            }
            if (typeof workflow.run_at !== 'string' || !workflow.run_at.trim()) {
              failures.push('status.workflow.run_at must be a non-empty string');
            }
            const requiredSources = ['gemini', 'twelvedata', 'fred', 'fx', 'market_news'];
            const sources = (((data.status || {}).sources) || {});
            for (const source of requiredSources) {
              if (!(source in sources)) failures.push(`status.sources missing ${source}`);
            }
          }

          // These pairs must match tools/build_news.py exactly — it is the thing
          // this gate exists to police. Two changes had been made to the build
          // without this list following them, so the gate failed on every PR:
          // news_template.html builds guide.html (news.html is now a
          // hand-written redirect stub and is deliberately NOT generated), and
          // partner_template.html renders TWICE with a __DESKMODE__ token that
          // has to be substituted before the outputs can be compared.
          const pairs = [
            ['tools/news_template.html', 'guide.html', {}],
            ['tools/partner_template.html', 'partner.html', { __DESKMODE__: 'buyer' }],
            ['tools/partner_template.html', 'cost-desk.html', { __DESKMODE__: 'cost' }],
            ['tools/team_template.html', 'team.html', {}],
            ['tools/executive_template.html', 'executive.html', {}]
          ];
          const buildDir = fs.mkdtempSync(path.join(os.tmpdir(), 'birdland-build-'));
          for (const [template, output, extra] of pairs) {
            const templateText = read(template);
            const tokenCount = templateText.split('__DATA__').length - 1;
            if (tokenCount !== 1) failures.push(`${template} must contain exactly one __DATA__ token`);
            let expected = templateText.split('__DATA__').join(dataText);
            for (const [token, value] of Object.entries(extra)) {
              expected = expected.split(token).join(value);
            }
            fs.writeFileSync(path.join(buildDir, output), expected, 'utf8');
            if (expected !== read(output)) failures.push(`${output} is not rebuilt from ${template}`);
            // A token that survives into the output ships to the reader as
            // literal text, and __DESKMODE__ surviving also breaks the split.
            for (const token of ['__DATA__', '__DESKMODE__']) {
              if (read(output).includes(token)) failures.push(`${output} contains unresolved ${token}`);
            }
          }

          const textFiles = [
            'AGENTS.md', 'index.html', 'outlook-data.json',
            'news.html', 'partner.html', 'team.html',
            'executive.html', 'privacy.html', 'calendar-events.json',
            'tools/news_template.html', 'tools/partner_template.html',
            'tools/team_template.html', 'tools/executive_template.html',
            'tools/build_news.py', 'tools/build_calendars.js', 'tools/build_feeds.py',
            'tools/gen_news_gemini.py', 'tools/fetch_market.py',
            'partner-desk.webmanifest', 'executive-desk.webmanifest',
            'partner-desk-icon.svg', 'service-worker.js'
          ];
          for (const file of textFiles) {
            const bytes = fs.readFileSync(file);
            if (bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf) {
              failures.push(`${file} has a UTF-8 BOM`);
            }
            if (Array.from(bytes).some((byte) => byte <= 8 || (byte >= 14 && byte <= 31))) {
              failures.push(`${file} contains control characters`);
            }
          }

          if (failures.length) {
            console.error(failures.map((failure) => `::error::${failure}`).join('\n'));
            process.exit(1);
          }
          console.log(`Validated ${regionKeys.length} regions and ${pairs.length} generated pages.`);
          console.log(`Temporary build output: ${buildDir}`);
          NODE

      # The apps are named in five places that cannot import from one another.
      # Nothing checked they agreed, and the last rename left the site
      # navigation offering "Buyer Desk" and "Cost Desk" for months.
      # The generator runs only inside the nightly workflow, so a syntax error
      # in it does not fail anything here — it just stops the site updating,
      # silently, while fetch_market keeps committing. That is exactly how an
      # f-string over a brace-filled prompt froze the daily refresh once
      # before. Compile every tool, and run the digest validator's own
      # assertions, which need no API key.
      - name: Compile Python tools and run generator selftest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q tools
          python3 tools/gen_news_gemini.py --selftest
          python3 tools/gen_promo_gemini.py --selftest

      # outlook-data.json is inlined verbatim into five generated pages, so a
      # kilobyte added to the data is a kilobyte added to every one of them,
      # downloaded again on each edition. The daily digest carries ten
      # languages and a five-edition archive, which is exactly the kind of
      # thing that grows quietly. These ceilings are roughly 1.4x today's
      # sizes: room to grow, but not room to double unnoticed.
      - name: Check the data and page size budget
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const budget = [
            ['outlook-data.json', 150 * 1024],
            ['executive.html', 260 * 1024],
            ['guide.html', 190 * 1024]
          ];
          let bad = 0;
          for (const [file, cap] of budget) {
            const size = fs.statSync(file).size;
            const pct = Math.round((size / cap) * 100);
            console.log(`${file}: ${size} bytes, ${pct}% of budget`);
            if (size > cap) { console.error(`::error::${file} is ${size} bytes, over its ${cap}-byte budget`); bad++; }
          }
          process.exit(bad ? 1 : 0);
          NODE

      - name: Check the app list agrees everywhere
        shell: bash
        run: |
          set -euo pipefail
          node tools/dev/verify-app-list.js

      - name: Validate public calendar feeds
        shell: bash
        run: |
          set -euo pipefail
          node tools/build_calendars.js
          git diff --exit-code -- calendars

      - name: Validate public RSS feeds
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_feeds.py
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files=glob.glob('feeds/*.xml')
          assert files, 'no RSS feeds built'
          for path in files: ET.parse(path)
          print('validated', len(files), 'RSS feeds')
          PY
          git diff --exit-code -- feeds

      - name: Package static preview snapshot
        shell: bash
        run: |
          set -euo pipefail
          preview="$RUNNER_TEMP/birdland-preview"
          mkdir -p "$preview"
          cp index.html news.html partner.html team.html executive.html privacy.html CNAME robots.txt partner-desk.webmanifest executive-desk.webmanifest partner-desk-icon.svg service-worker.js calendar-events.json "$preview/"
          cp -R images "$preview/images"
          cp -R calendars "$preview/calendars"
          cp -R feeds "$preview/feeds"
          printf 'This is a PR validation snapshot. It is not deployed.\n' > "$preview/README.txt"

      - name: Upload static preview snapshot
        uses: actions/upload-artifact@v4
        with:
          name: birdland-static-preview-${{ github.event.pull_request.number || github.run_id }}
          path: ${{ runner.temp }}/birdland-preview
          if-no-files-found: error
          retention-days: 7
